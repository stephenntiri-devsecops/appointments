server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: scheduler
    password: scheduler
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: http://localhost:9999/realms/demo # replace in prod

app:
  temporal:
    target: localhost:7233
    namespace: default
    taskQueue: appointment-notifications
